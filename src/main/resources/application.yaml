server:
  port: 8080

spring:
  application:
    name: ai-study-hub-api
  jackson:
    time-zone: UTC
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  threads:
    virtual:
      enabled: true # Java 21 virtual threads: Tomcat request threads + @Async taskExecutor serve blocking I/O (RAG WebClient) without pinning OS threads
  servlet:
    multipart:
      # Multipart ceiling intentionally sits above the 50MB business rule
      # (app.upload.max-file-size-bytes) so the upload-module size check governs
      # the limit and returns a clean 400 instead of a generic 500.
      max-file-size: 60MB
      max-request-size: 60MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/google/callback}"
            scope:
              - email
              - profile
        provider:
          google:
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aistudyhub}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:your_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_ACCOUNT:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        # Chỉ expose các endpoint an toàn qua HTTP; /env, /beans, /heapdump... KHÔNG public.
        # Toàn bộ /actuator/** (trừ /actuator/health) khoá chỉ ADMIN trong SecurityConfig.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized # ẩn chi tiết probe (DB/Redis) với anonymous

logging:
  level:
    root: INFO
    web: INFO
    vn.ai_study_hub_api: DEBUG # Thêm dòng này để log ra các bước xử lý của bạn
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:ai-study-hub-bucket}
    region: ${AWS_REGION:ap-southeast-1}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    endpoint: ${AWS_S3_ENDPOINT:}

fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000/api/v1/rag}
  rag-process-url: ${FASTAPI_RAG_PROCESS_URL:http://localhost:8000/api/v1/rag/process}
  rag-chat-url: ${FASTAPI_RAG_CHAT_URL:http://localhost:8000/api/v1/chat}
  rag-quiz-url: ${FASTAPI_RAG_QUIZ_URL:http://localhost:8000/api/v1/quiz/generate}
  rag-flashcard-url: ${FASTAPI_RAG_FLASHCARD_URL:http://localhost:8000/api/v1/flashcard/generate}
  chat-timeout-seconds: ${FASTAPI_CHAT_TIMEOUT_SECONDS:30}
  # Generation (quiz/flashcard) makes a larger Gemini call than chat (many items) -> longer ceiling.
  study-material-timeout-seconds: ${FASTAPI_STUDY_MATERIAL_TIMEOUT_SECONDS:60}

app:
  share-url-prefix: ${SHARE_URL_PREFIX:http://localhost:5173/shared/}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  plan:
    # Plan duration applied on a successful VNPay payment (BR-PAY-05). Unit is HOURS so test
    # windows shorter than a day are expressible (plusDays() cannot do sub-day). Default 720h = 30 days.
    # To test the downgrade flow fast: set APP_PLAN_DURATION_HOURS=1 (plan expires in 1 hour).
    duration-hours: ${APP_PLAN_DURATION_HOURS:720}
  upload:
    # Per-file size cap enforced in DocumentServiceImpl.initiateUpload.
    # Keep spring.servlet.multipart.max-file-size >= this value.
    max-file-size-bytes: ${APP_UPLOAD_MAX_FILE_SIZE:52428800} # 50MB
  document:
    # Soft-deleted documents are permanently purged (S3 + DB) after this many days.
    retention-days: ${APP_DOCUMENT_RETENTION_DAYS:30}
  jwt:
    secret: ${JWT_SECRET} # KHÔNG có default — fail-fast nếu thiếu env (tránh dùng secret hardcode)
    access-expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  internal:
    secret: ${INTERNAL_API_SECRET} # KHÔNG có default — phải khớp INTERNAL_API_SECRET của RAG service
  async:
    core-pool-size: 5
    max-pool-size: 20
    queue-capacity: 100
    thread-name-prefix: doc-async-
  cache:
    # TTL per Redis cache; externalized so ops can tune without rebuild.
    # Trending: popular-doc ranking changes slowly -> 10m. Public tags: tiny, rarely mutate -> 30m.
    trending-documents-ttl-minutes: ${APP_CACHE_TRENDING_TTL_MIN:10}
    public-tags-ttl-minutes: ${APP_CACHE_PUBLIC_TAGS_TTL_MIN:30}
    default-ttl-minutes: ${APP_CACHE_DEFAULT_TTL_MIN:5}
    ai-metrics-ttl-minutes: ${APP_CACHE_AI_METRICS_TTL_MIN:720} # 12h: scheduler-driven refresh (AiMetricsRefreshScheduler 6x/day); TTL > overnight 21:00->06:00 gap so the entry never goes empty between fires
  moderation:
    # Redis Streams job queue for auto-moderation (durable replacement for @Async fire-and-forget).
    stream-key: stream:moderation
    group: moderation-cg
    consumer-name: ${HOSTNAME:api-1}     # MUST differ per instance (env HOSTNAME/POD_NAME)
    poll-timeout-seconds: 2
    batch-size: 1
    max-attempts: 5                       # delivery-count threshold -> DLQ
    dlq-key: stream:moderation:dlq
    reclaim:
      enabled: true
      fixed-delay-ms: 60000               # how often to scan the PEL for stale messages
      min-idle-ms: 300000                 # only reclaim messages idle > 5min (avoids stealing in-flight work)
    image:
      # Moderation of embedded images (PDF/DOCX) alongside text. A whole-flow failure defers the
      # document to manual review (PENDING) instead of auto-approving unchecked images.
      enabled: ${APP_MODERATION_IMAGE_ENABLED:true}
      max-per-doc: ${APP_MODERATION_IMAGE_MAX:30}
      batch-size: ${APP_MODERATION_IMAGE_BATCH:5}

langfuse:
  # Admin AI dashboard observability (docs/langfuse-metrics-cookbook.md).
  # Keys from Langfuse UI → Project Settings → API Keys (same as RAG service .env).
  # Blank keys => AiMetricsService returns an all-empty payload (fail-open, never 5xx).
  base-url: ${LANGFUSE_BASE_URL:https://cloud.langfuse.com}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  timeout-seconds: ${LANGFUSE_TIMEOUT_SECONDS:10}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay-callback}

openai:
  api-key: ${OPENAI_API_KEY:}
  moderation-url: ${OPENAI_MODERATION_URL:https://api.openai.com/v1/moderations}